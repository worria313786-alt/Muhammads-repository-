name: Windows 11 RDP
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Configure Windows User and RDP
      run: |
        $Password = ConvertTo-SecureString "RdpPassword123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
    - name: Start Free LocalTunnel Connection
      run: |
        # Install Node.js package manager tools to use localtunnel
        npm install -g localtunnel
        
        # Launch localtunnel in the background pointing to the RDP port
        Start-Process lt -ArgumentList "--port 3389" -RedirectStandardOutput "tunnel.log"
        Start-Sleep -Seconds 10
        
        # Read the URL right off your screen
        Write-Host "=================== YOUR CONNECTION URL ==================="
        Get-Content "tunnel.log"
        Write-Host "==========================================================="
        
    - name: Keep Alive
      run: |
        $timeout = (Get-Date).AddHours(5)
        while ((Get-Date) -lt $timeout) {
            Start-Sleep -Seconds 30
        }


        
