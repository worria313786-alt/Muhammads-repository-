name: Windows 11 RDP
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Configure Windows User and RDP
      run: |
        $Password = ConvertTo-SecureString "RdpPassword123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
    - name: Launch Free Pagekite Tunnel
      run: |
        # Download the official standalone pagekite tool for Windows
        Invoke-WebRequest -Uri "https://pagekite.net" -OutFile "pagekite.py"
        
        # Start a raw network TCP tunnel on port 3389 and dump the connection info to a log file
        Start-Process python -ArgumentList "pagekite.py 3389 tcp+raw" -RedirectStandardOutput "tunnel.log"
        Start-Sleep -Seconds 15
        
        # Display the custom connection link on your screen
        Write-Host "=================== YOUR PHONE CONNECTION ADDRESS ==================="
        if (Test-Path "tunnel.log") { Get-Content "tunnel.log" }
        Write-Host "===================================================================="
        
    - name: Keep Machine Alive
      run: |
        $timeout = (Get-Date).AddHours(5)
        while ((Get-Date) -lt $timeout) {
            Start-Sleep -Seconds 30
        }







        
