name: Windows 11 RDP
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Configure Windows User and RDP
      run: |
        $Password = ConvertTo-SecureString "RdpPassword123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
    - name: Launch Free Serveo Tunnel
      run: |
        # Download a tiny tool to help background the tunnel neatly
        Invoke-WebRequest -Uri "https://github.com" -OutFile "keepalive.sh"
        
        # Start a raw SSH port forward to map Windows RDP (3389) out to the public web via Serveo
        Start-Process cmd.exe -ArgumentList "/c ssh -o StrictHostKeyChecking=no -R 0:127.0.0.1:3389 serveo.net" -RedirectStandardOutput "tunnel.log"
        Start-Sleep -Seconds 15
        
        # Read your unique connection address right off your screen
        Write-Host "=================== YOUR PHONE CONNECTION ADDRESS ==================="
        if (Test-Path "tunnel.log") { Get-Content "tunnel.log" }
        Write-Host "===================================================================="
        
    - name: Keep Machine Alive
      run: |
        $timeout = (Get-Date).AddHours(5)
        while ((Get-Date) -lt $timeout) {
            Start-Sleep -Seconds 30
        }






        
