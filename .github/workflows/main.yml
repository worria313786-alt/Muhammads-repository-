name: Windows 11 RDP
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Configure Windows User and RDP
      run: |
        $Password = ConvertTo-SecureString "RdpPassword123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
    - name: Start Free LocalTunnel Connection
      run: |
        # Launch localtunnel via cmd.exe so it processes the Node paths correctly
        Start-Process cmd.exe -ArgumentList "/c npx localtunnel --port 3389" -RedirectStandardOutput "tunnel.log"
        Start-Sleep -Seconds 15
        
        # Read the URL right off your screen
        Write-Host "=================== YOUR CONNECTION URL ==================="
        if (Test-Path "tunnel.log") { Get-Content "tunnel.log" }
        Write-Host "==========================================================="
        
    - name: Keep Alive
      run: |
        $timeout = (Get-Date).AddHours(5)
        while ((Get-Date) -lt $timeout) {
            Start-Sleep -Seconds 30
        }




        
